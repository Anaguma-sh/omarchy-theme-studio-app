name: Build desktop app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Omarchy-Theme-Studio-x64
          path: dist/*.AppImage
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Omarchy-Theme-Studio-x64
          path: dist
      - run: cd dist && sha256sum *.AppImage > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/SHA256SUMS --title "Omarchy Theme Studio $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
